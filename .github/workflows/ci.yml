name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:

jobs:
  quality:
    name: Typecheck And Readonly Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run readonly guard
        run: pnpm check:readonly

      - name: Run unit tests
        run: pnpm test:unit

      - name: Build app
        run: pnpm build

      - name: Run build smoke test
        run: pnpm smoke:build
